      <symbol id="i-eye-slash" viewBox="0 0 256 256" fill="currentColor"><path d="M53.92,34.62A8,8,0,1,0,42.08,45.38L61.32,66.55C25,88.84,9.38,123.2,8.69,124.76a8,8,0,0,0,0,6.5c.35.79,8.82,19.57,27.65,38.4C61.43,194.74,93.12,208,128,208a127.11,127.11,0,0,0,52.07-10.83l22,24.21a8,8,0,1,0,11.84-10.76Zm47.33,75.84,41.67,45.85a32,32,0,0,1-41.67-45.85ZM128,192c-30.78,0-57.67-11.19-79.93-33.25A133.16,133.16,0,0,1,25,128c4.69-8.79,19.66-33.39,47.35-49.38l18,19.75a48,48,0,0,0,63.66,70l14.73,16.2A112,112,0,0,1,128,192Zm6-95.43a8,8,0,0,1,3-15.72,48.16,48.16,0,0,1,38.77,42.64,8,8,0,0,1-7.22,8.71,6.39,6.39,0,0,1-.75,0,8,8,0,0,1-8-7.26A32.09,32.09,0,0,0,134,96.57Zm113.28,34.69c-.42.94-10.55,23.37-33.36,43.8a8,8,0,1,1-10.67-11.92A132.77,132.77,0,0,0,231.05,128a133.15,133.15,0,0,0-23.12-30.77C185.67,75.19,158.78,64,128,64a118.37,118.37,0,0,0-19.36,1.57A8,8,0,1,1,106,49.79,134,134,0,0,1,128,48c34.88,0,66.57,13.26,91.66,38.35,18.83,18.83,27.3,37.62,27.65,38.41A8,8,0,0,1,247.31,131.26Z"/></symbol>

    <a class="skiplink" href="#feed">跳到动态列表</a>

    <header class="cover" id="top">
      <div class="cover__media" id="cover-media"></div>
      <div class="cover__scrim" aria-hidden="true"></div>
      <div class="cover__body">
        <div class="cover__inner">
          <div class="cover__avatar" id="cover-avatar" aria-hidden="true"></div>
          <div class="cover__text">
            <h1 class="cover__title" id="cover-title">宝宝成长记</h1>
            <p class="cover__signature" id="cover-signature"></p>
            <ul class="cover__kids" id="cover-kids"></ul>
          </div>
        </div>
      </div>
    </header>

    <nav class="topbar" id="topbar" aria-label="筛选与视图">
      <div class="topbar__inner">
        <span class="topbar__brand" id="brand-title">宝宝成长记</span>
        <div class="topbar__filters" id="filters" role="group" aria-label="按宝宝筛选"></div>
        <div class="topbar__actions">
          <span class="topbar__sep" aria-hidden="true"></span>
          <button
            class="iconbtn"
            id="video-only"
            type="button"
            aria-pressed="false"
            aria-label="只看视频"
            title="只看视频"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-film-strip" /></svg>
            <span class="iconbtn__label">视频</span>
          </button>
          <button
            class="iconbtn iconbtn--solo"
            id="theme-toggle"
            type="button"
            aria-label="切换深浅色"
            title="切换深浅色"
          >
            <svg class="icon" aria-hidden="true"><use href="#i-sun" /></svg>
          </button>
          <!-- 登录：只有「本地服务 + 开了账号认证 + 当前没登录」时才显示。
               它和下面的「发布」互斥 —— 没登录时看不到发布按钮，登录后就倒过来。 -->
          <button
            class="iconbtn iconbtn--auth"
            id="open-auth"
            type="button"
            aria-label="登录"
            title="登录后可以发布"
            hidden
          >
            <svg class="icon" aria-hidden="true"><use href="#i-sign-in" /></svg>
            <span class="iconbtn__label">登录</span>
          </button>
          <!-- 发布：只有本地服务（有后端）时才显示；静态导出里保持 hidden -->
          <button
            class="iconbtn iconbtn--pub"
            id="open-publish"
            type="button"
            aria-label="发布动态"
            title="发布动态"
            hidden
          >
            <svg class="icon" aria-hidden="true"><use href="#i-camera" /></svg>
            <span class="iconbtn__label">发布</span>
          </button>
        </div>
      </div>
    </nav>

    <main class="page" id="main">
      <p class="meta-line" id="meta-line"></p>

      <section class="feed" id="feed" aria-label="宝宝动态"></section>

      <div class="feed__more" id="more">
        <div id="sentinel" aria-hidden="true"></div>
        <button class="btn btn--ghost" id="load-more" type="button">继续往下看</button>
      </div>
    </main>

    <footer class="footer">
      <p class="footer__text" id="footer-text"></p>
    </footer>

    <!-- 查看大图 -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="查看大图" hidden>
      <div class="lightbox__scrim" data-close></div>
      <div class="lightbox__bar">
        <div class="lightbox__info">
          <p class="lightbox__caption" id="lb-caption"></p>
          <p class="lightbox__sub" id="lb-sub"></p>
        </div>
        <button class="iconbtn iconbtn--onDark" id="lb-close" type="button" aria-label="关闭">
          <svg class="icon" aria-hidden="true"><use href="#i-x" /></svg>
        </button>
      </div>
      <div class="lightbox__stage" id="lb-stage"></div>
      <div class="lightbox__actions">
        <button class="ghostbtn" id="lb-original" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-arrows-out-simple" /></svg>查看原图
        </button>
        <a class="ghostbtn" id="lb-download" download>
          <svg class="icon" aria-hidden="true"><use href="#i-download-simple" /></svg>保存
        </a>
      </div>
      <button class="navbtn navbtn--prev" id="lb-prev" type="button" aria-label="上一张">
        <svg class="icon" aria-hidden="true"><use href="#i-caret-left" /></svg>
      </button>
      <button class="navbtn navbtn--next" id="lb-next" type="button" aria-label="下一张">
        <svg class="icon" aria-hidden="true"><use href="#i-caret-right" /></svg>
      </button>
    </div>

    <!-- 发布动态（只在本地服务下可用） -->
    <div
      class="sheet"
      id="publish"
      role="dialog"
      aria-modal="true"
      aria-labelledby="pub-heading"
      hidden
    >
      <div class="sheet__scrim" data-close></div>
      <div class="sheet__panel">
        <header class="sheet__head">
          <h2 class="sheet__title" id="pub-heading">发布动态</h2>
          <button class="iconbtn iconbtn--solo" id="pub-close" type="button" aria-label="关闭">
            <svg class="icon" aria-hidden="true"><use href="#i-x" /></svg>
          </button>
        </header>

        <div class="sheet__body">
          <input type="file" id="pub-file" multiple hidden />

          <button class="drop" id="pub-drop" type="button">
            <svg class="icon drop__icon" aria-hidden="true"><use href="#i-upload-simple" /></svg>
            <span class="drop__title">把照片或视频拖到这里</span>
            <span class="drop__hint">也可以点这里选择，或直接 <kbd>⌘V</kbd> 粘贴</span>
          </button>

          <div class="picked" id="pub-picked" hidden>
            <ul class="picked__grid" id="pub-grid"></ul>
            <div class="picked__foot">
              <span class="picked__count" id="pub-count"></span>
              <button class="linkbtn" id="pub-clear" type="button">全部移除</button>
            </div>
          </div>

          <textarea
            class="afield afield--area"
            id="pub-caption"
            rows="2"
            maxlength="4000"
            placeholder="说点什么…"
          ></textarea>

          <div class="afield-row">
            <label class="afield afield--sm">
              <span class="afield__label">日期</span>
              <input type="date" id="pub-date" />
            </label>
            <label class="afield afield--sm">
              <span class="afield__label">时间</span>
              <input type="time" id="pub-time" />
            </label>
          </div>

          <div class="afield">
            <span class="afield__label">谁出镜</span>
            <div class="kids" id="pub-kids" role="group" aria-label="选择宝宝"></div>
          </div>

          <details class="more">
            <summary class="more__sum">
              <svg class="icon" aria-hidden="true"><use href="#i-caret-down" /></svg>
              <span>更多选项</span>
            </summary>
            <div class="more__body">
              <label class="afield">
                <span class="afield__label">标题</span>
                <input type="text" id="pub-title" maxlength="60" placeholder="例如：第一次翻身" />
              </label>
              <label class="afield">
                <span class="afield__label">地点</span>
                <input type="text" id="pub-location" maxlength="60" placeholder="例如：外婆家" />
              </label>
            </div>
          </details>
        </div>

        <footer class="sheet__foot">
          <p class="sheet__who" id="pub-who" hidden></p>
          <p class="sheet__note" id="pub-note"></p>
          <div class="sheet__acts">
            <button class="btn btn--ghost" id="pub-cancel" type="button">取消</button>
            <button class="btn btn--primary" id="pub-submit" type="button">发布</button>
          </div>
          <div class="bar" id="pub-bar" hidden><span class="bar__fill" id="pub-bar-fill"></span></div>
        </footer>
      </div>
    </div>

    <!-- 登录（本地服务 + 开了账号认证时才用得到）。
         看照片始终不需要登录，这里只为「往照片库里写」这一步把关。 -->
    <div
      class="sheet"
      id="login"
      role="dialog"
      aria-modal="true"
      aria-labelledby="auth-heading"
      hidden
    >
      <div class="sheet__scrim" data-close></div>
      <div class="sheet__panel sheet__panel--narrow">
        <header class="sheet__head">
          <h2 class="sheet__title" id="auth-heading">登录</h2>
          <button class="iconbtn iconbtn--solo" id="auth-close" type="button" aria-label="关闭">
            <svg class="icon" aria-hidden="true"><use href="#i-x" /></svg>
          </button>
        </header>

        <form class="sheet__body" id="auth-form" novalidate>
          <p class="auth__lead">
            看照片不用登录，只有<strong>往照片库里发布</strong>时才需要。
          </p>

          <label class="afield">
            <span class="afield__label">账号</span>
            <span class="afield__wrap">
              <svg class="icon afield__icon" aria-hidden="true"><use href="#i-user" /></svg>
              <input
                type="text"
                id="auth-user"
                name="username"
                autocomplete="username"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                maxlength="32"
                placeholder="名字或别名，例如 妈妈"
              />
            </span>
          </label>

          <label class="afield">
            <span class="afield__label">口令</span>
            <span class="afield__wrap">
              <svg class="icon afield__icon" aria-hidden="true"><use href="#i-lock" /></svg>
              <input
                type="password"
                id="auth-pass"
                name="password"
                autocomplete="current-password"
                maxlength="200"
                placeholder="口令"
              />
              <button
                class="reveal"
                id="auth-reveal"
                type="button"
                aria-label="显示口令"
                aria-pressed="false"
              >
                <svg class="icon" aria-hidden="true"><use href="#i-eye" /></svg>
              </button>
            </span>
          </label>
        </form>

        <footer class="sheet__foot">
          <p class="sheet__note" id="auth-note"></p>
          <div class="sheet__acts">
            <button class="btn btn--ghost" id="auth-cancel" type="button">取消</button>
            <button class="btn btn--primary" id="auth-submit" type="button">登录</button>
          </div>
        </footer>
      </div>
    </div>

    <button class="totop" id="to-top" type="button" aria-label="回到顶部" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-arrow-up" /></svg>
    </button>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <span class="toast__text" id="toast-text"></span>
      <button class="toast__btn" id="toast-action" type="button" hidden></button>
    </div>

    <noscript>
      <p class="noscript">这个页面需要启用 JavaScript 才能加载照片时间线。</p>
    </noscript>

    <script src="/assets/app.js" type="module"></script>
  </body>
</html>
